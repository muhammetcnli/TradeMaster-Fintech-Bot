services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: trademaster-postgres
    environment:
      POSTGRES_DB: fintechdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d fintechdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trademaster-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: trademaster-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trademaster-network

volumes:
  postgres_data:
  redis_data:

networks:
  trademaster-network:
    driver: bridge

