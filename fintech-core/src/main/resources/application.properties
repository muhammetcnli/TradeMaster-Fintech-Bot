spring.application.name=trademaster-fintech-bot
spring.config.import=optional:file:.env[.properties]

# --- JACKSON ---
spring.jackson.property-naming-strategy=SNAKE_CASE

# --- LOGGING ---
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} [%X{telegramUserId}] [%X{username}] [%X{command}] - %msg%n
logging.level.com.trademaster.fintech_core.service.TelegramBotService=DEBUG
logging.level.com.trademaster.fintech_core.service.AuthService=DEBUG
logging.level.com.trademaster.fintech_core.controller.TelegramWebhookController=DEBUG

# --- DATABASE CONFIGURATION (PostgreSQL) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fintechdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / HIBERNATE SETTINGS ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- REDIS CONFIGURATION ---
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}


# --- PRICE CACHE CONFIGURATION ---
price.cache.ttl-seconds=60
price.cache.cooldown-seconds=30

telegram.bot.username=${TELEGRAM_BOT_USERNAME:}
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.webhook.secret=${TELEGRAM_WEBHOOK_SECRET:}
telegram.bot.internal-secret=${TELEGRAM_BOT_INTERNAL_SECRET:}

# --- COINGECKO API CONFIGURATION ---
coingecko.api.base-url=https://api.coingecko.com/api/v3
coingecko.api.key=${COINGECKO_API_KEY:}

# --- ALPHA VANTAGE API CONFIGURATION ---
alphavantage.api.base-url=https://www.alphavantage.co/query
alphavantage.api.key=${ALPHA_VANTAGE_API_KEY:}

# --- FRANKFURTER API CONFIGURATION ---
frankfurter.api.base-url=https://api.frankfurter.dev/v1

# --- MARKET CONFIGURATION ---
market.default-asset-type=CRYPTO

# --- AUTOMATION ---
# Frequency to check price alerts and auto-trade rules (in milliseconds)
telegram.automation.poll-ms=30000
